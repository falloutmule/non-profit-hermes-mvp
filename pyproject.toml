[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "non-profit-hermes"
version = "1.0.0"
description = "Portable foundations for the Non-Profit Hermes operations assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-auth>=2,<3",
    "google-api-python-client>=2,<3",
    "PyYAML>=6,<7",
]

[project.scripts]
nonprofit-hermes = "non_profit_hermes.doctor:main"

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
non_profit_hermes = ["resources/defaults.toml"]

[tool.setuptools.exclude-package-data]
"*" = ["*.env", "*.json", "*.db", "*.sqlite*", "*.log", "*.pem", "*.key", "*.token"]

[tool.setuptools.packages.find]
where = ["."]
include = ["non_profit_hermes*"]
exclude = ["tests*", "scripts*", "runtime_plugins*", "docs*", "reports*", "proof*"]
